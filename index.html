<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Derrick 的 IELTS 备考站</title>
<style>
:root {
  --bg: #f5f0eb;
  --card: #ffffff;
  --text: #2c2416;
  --sub: #8b7355;
  --accent: #c75b39;
  --accent-hover: #a0482e;
  --border: #e0d5c7;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 20px;
}
.container { width: 100%; max-width: 640px; }
.header { text-align: center; margin: 72px 0 32px; }
.header h1 {
  font-size: 1.8rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.header .subtitle {
  font-size: 0.9rem;
  color: var(--sub);
  margin-top: 8px;
}
.module-list { display: grid; gap: 14px; }
.module-card {
  display: block;
  padding: 24px 26px;
  background: var(--card);
  border: 1.5px solid transparent;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  color: var(--text);
  text-decoration: none;
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.module-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}
.module-card h2 { font-size: 1.1rem; margin-bottom: 7px; }
.module-card p { color: var(--sub); font-size: 0.88rem; line-height: 1.6; }
.module-arrow { float: right; color: var(--accent); font-size: 1.2rem; margin-top: 4px; }
.footer { text-align: center; color: var(--sub); font-size: 0.78rem; margin-top: 28px; }
@media (max-width: 480px) {
  .header { margin-top: 44px; }
  .module-card { padding: 21px 20px; }
}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <h1>Derrick 的 IELTS 备考站</h1>
    <p class="subtitle">为雅思备考整理的个人学习空间</p>
  </header>

  <main class="module-list" aria-label="学习模块">
    <a class="module-card" href="words.html">
      <span class="module-arrow">→</span>
      <h2>单词</h2>
      <p>错词表、538 考点词、听力听写，以及 d 系列词库。</p>
    </a>
    <a class="module-card" href="writing.html">
      <span class="module-arrow">→</span>
      <h2>作文</h2>
      <p>整理雅思写作素材、范文与练习记录。</p>
    </a>
    <a class="module-card" href="speaking.html">
      <span class="module-arrow">→</span>
      <h2>口语</h2>
      <p>语言习惯、P1 / P2 / P3 资料与考场演练。</p>
    </a>
  </main>
  <p class="footer">Derrick · IELTS preparation</p>
</div>
</body>
</html>
