<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Derrick 的 IELTS 备考站 — 考前急救</title>
<style>
:root {
  --bg: #f5f0eb;
  --card: #ffffff;
  --text: #2c2416;
  --sub: #8b7355;
  --accent: #c75b39;
  --accent-hover: #a0482e;
  --border: #e0d5c7;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
  --bad: #9b3b2e;
  --good: #3d6b54;
  --bad-bg: #f8ece8;
  --good-bg: #eaf3ee;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 20px;
}
.container { width: 100%; max-width: 640px; }
.header { text-align: center; margin: 36px 0 16px; }
.header h1 { font-size: 1.7rem; letter-spacing: 0.02em; }
.header .subtitle { color: var(--sub); font-size: 0.88rem; margin-top: 7px; line-height: 1.6; }
.page-nav { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.home-link {
  display: inline-flex;
  align-items: center;
  padding: 10px 18px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 999px;
  box-shadow: var(--shadow);
  color: var(--sub);
  font-size: 0.92rem;
  line-height: 1.2;
  text-decoration: none;
  transition: color 0.2s, border-color 0.2s;
}
.home-link:hover, .home-link:active { color: var(--accent); border-color: var(--accent); }
.chips {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 8px 0 12px;
  margin: 0 -4px 12px;
  background: linear-gradient(var(--bg) 70%, rgba(245,240,235,0.92));
  -webkit-overflow-scrolling: touch;
}
.chips a {
  flex: 0 0 auto;
  padding: 7px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--sub);
  font-size: 0.78rem;
  text-decoration: none;
  white-space: nowrap;
}
.chips a:hover, .chips a:active { color: var(--accent); border-color: var(--accent); }
.source {
  color: var(--sub);
  font-size: 0.84rem;
  line-height: 1.7;
  margin-bottom: 16px;
}
.section {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 20px 8px;
  margin-bottom: 14px;
  scroll-margin-top: 56px;
}
.section h2 { font-size: 1.08rem; margin-bottom: 8px; }
.intro { color: var(--sub); font-size: 0.88rem; line-height: 1.7; margin-bottom: 14px; }
.block { margin-bottom: 16px; }
.block h3 {
  font-size: 0.92rem;
  margin-bottom: 8px;
}
.block p, .block li {
  font-size: 0.9rem;
  line-height: 1.75;
  margin-bottom: 6px;
}
.block ul { padding-left: 1.15em; }
.callout {
  background: #fdf3ef;
  border: 1px solid #f0d4c8;
  color: var(--accent-hover);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 0.84rem;
  line-height: 1.65;
  margin: 8px 0 10px;
}
.rule {
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 10px;
  padding: 12px 0;
  border-top: 1px dashed var(--border);
}
.rule:first-of-type { border-top: none; padding-top: 0; }
.rule .n {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  font-size: 0.92rem;
  display: flex;
  align-items: center;
  justify-content: center;
}
.rule h3 { font-size: 0.98rem; margin-bottom: 4px; }
.rule p { color: var(--text); font-size: 0.88rem; line-height: 1.65; }
.pair {
  display: grid;
  gap: 4px;
  margin-bottom: 8px;
}
.bad, .good {
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 0.86rem;
  line-height: 1.55;
}
.bad { background: var(--bad-bg); color: var(--bad); }
.good { background: var(--good-bg); color: var(--good); }
.tag {
  display: inline-block;
  min-width: 1.4em;
  font-weight: 700;
  font-size: 0.72rem;
  margin-right: 6px;
  letter-spacing: 0.04em;
}
.speech-line {
  background: #fafaf8;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 0.88rem;
  line-height: 1.65;
  margin-bottom: 6px;
}
.empty { color: var(--sub); text-align: center; padding: 40px 12px; }
@media (max-width: 480px) {
  .header { margin-top: 20px; }
  .section { padding: 16px 14px 6px; }
}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <h1 id="pageTitle">考前急救</h1>
    <p class="subtitle" id="pageSubtitle">开考前把你会犯的错过一遍</p>
  </header>
  <nav class="page-nav">
    <a class="home-link" href="index.html">← 返回模块选择</a>
    <a class="home-link" href="speaking.html">去口语演练</a>
  </nav>
  <nav class="chips" id="chips" aria-label="快速跳转"></nav>
  <main id="app"></main>
</div>
<script src="exam-notes-data.js"></script>
<script>
(function () {
  const DATA = window.__EXAM_NOTES__;
  const app = document.getElementById('app');
  if (!DATA) {
    app.innerHTML = '<p class="empty">数据加载失败，请确保 exam-notes-data.js 存在。</p>';
    return;
  }

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderPairs(pairs) {
    if (!pairs || !pairs.length) return '';
    return pairs.map(function (item) {
      return '<div class="pair">' +
        '<div class="bad"><span class="tag">错</span>' + esc(item.bad) + '</div>' +
        '<div class="good"><span class="tag">对</span>' + esc(item.good) + '</div>' +
        '</div>';
    }).join('');
  }

  function renderBlock(block) {
    const heading = block.heading ? '<h3>' + esc(block.heading) + '</h3>' : '';
    const callout = block.callout ? '<p class="callout">' + esc(block.callout) + '</p>' : '';
    const paragraphs = (block.paragraphs || []).map(function (text) {
      return '<p class="speech-line">' + esc(text) + '</p>';
    }).join('');
    const list = block.list && block.list.length
      ? '<ul>' + block.list.map(function (item) { return '<li>' + esc(item) + '</li>'; }).join('') + '</ul>'
      : '';
    return '<div class="block">' + heading + callout + paragraphs + list + renderPairs(block.pairs) + '</div>';
  }

  const golden = DATA.golden;
  const goldenHtml = '<section class="section" id="' + esc(golden.id) + '">' +
    '<h2>' + esc(golden.name) + '</h2>' +
    (golden.intro ? '<p class="intro">' + esc(golden.intro) + '</p>' : '') +
    golden.items.map(function (item, i) {
      return '<article class="rule">' +
        '<div class="n">' + (i + 1) + '</div>' +
        '<div><h3>' + esc(item.title) + '</h3><p>' + esc(item.text) + '</p></div>' +
        '</article>';
    }).join('') +
    '</section>';

  const sectionsHtml = (DATA.sections || []).map(function (section) {
    return '<section class="section" id="' + esc(section.id) + '">' +
      '<h2>' + esc(section.name) + '</h2>' +
      (section.intro ? '<p class="intro">' + esc(section.intro) + '</p>' : '') +
      (section.blocks || []).map(renderBlock).join('') +
      '</section>';
  }).join('');

  document.getElementById('pageTitle').textContent = DATA.meta.title;
  document.getElementById('pageSubtitle').textContent = DATA.meta.subtitle;
  document.getElementById('chips').innerHTML = (DATA.nav || []).map(function (item) {
    return '<a href="#' + encodeURIComponent(item.id) + '">' + esc(item.name) + '</a>';
  }).join('');
  app.innerHTML = (DATA.meta.source ? '<p class="source">' + esc(DATA.meta.source) + '</p>' : '') +
    goldenHtml + sectionsHtml;
})();
</script>
</body>
</html>
