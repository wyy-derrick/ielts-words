<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Derrick 的 IELTS 备考站 — 作文</title>
<style>
:root {
  --bg: #f5f0eb;
  --card: #ffffff;
  --text: #2c2416;
  --sub: #8b7355;
  --accent: #c75b39;
  --accent-hover: #a0482e;
  --border: #e0d5c7;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 20px;
}
.container { width: 100%; max-width: 640px; }
.header { text-align: center; margin: 72px 0 24px; }
.header h1 { font-size: 1.7rem; letter-spacing: 0.02em; }
.header .subtitle { color: var(--sub); font-size: 0.88rem; margin-top: 7px; }
.page-nav { margin-bottom: 16px; }
.home-link { color: var(--sub); font-size: 0.85rem; text-decoration: none; }
.home-link:hover { color: var(--accent); }
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 52px 28px;
  box-shadow: var(--shadow);
  text-align: center;
}
.card h2 { font-size: 1.25rem; margin-bottom: 12px; }
.card p { color: var(--sub); font-size: 0.9rem; line-height: 1.7; }
.card .mark { color: var(--accent); font-size: 2rem; margin-bottom: 16px; }
@media (max-width: 480px) { .header { margin-top: 44px; } .card { padding: 44px 20px; } }
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <h1>作文模块</h1>
    <p class="subtitle">IELTS Writing</p>
  </header>
  <div class="page-nav"><a class="home-link" href="index.html">← 返回模块选择</a></div>
  <main class="card">
    <div class="mark">✦</div>
    <h2>作文内容建设中</h2>
    <p>这里将整理 Derrick 的雅思写作素材、范文和练习记录。<br>模块准备好后，会在这里继续更新。</p>
  </main>
</div>
</body>
</html>
