<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derrick 的 IELTS 备考站 — 单词</title>
<style>
:root {
  --bg: #f5f0eb;
  --card: #ffffff;
  --text: #2c2416;
  --sub: #8b7355;
  --accent: #c75b39;
  --accent-hover: #a0482e;
  --green: #4a8c5c;
  --red: #c0392b;
  --green-bg: #e8f5e9;
  --red-bg: #fdecea;
  --border: #e0d5c7;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 20px;
}
.container { width: 100%; max-width: 640px; }

/* Header */
.header {
  text-align: center;
  margin-bottom: 24px;
}
.header h1 {
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.02em;
}
  .header .subtitle {
  font-size: 0.85rem;
  color: var(--sub);
  margin-top: 4px;
}
.page-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: flex-start;
  margin-bottom: 16px;
}
.home-link {
  display: inline-flex;
  align-items: center;
  padding: 10px 18px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 999px;
  box-shadow: var(--shadow);
  color: var(--sub);
  font-size: 0.92rem;
  line-height: 1.2;
  text-decoration: none;
  transition: color 0.2s, border-color 0.2s;
}
.home-link:hover,
.home-link:active { color: var(--accent); border-color: var(--accent); }

/* Mode tabs */
.tabs {
  display: flex;
  background: var(--card);
  border-radius: var(--radius);
  padding: 4px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.tab {
  flex: 1;
  text-align: center;
  padding: 10px 0;
  font-size: 0.95rem;
  font-weight: 500;
  cursor: pointer;
  border-radius: 10px;
  transition: all 0.2s;
  color: var(--sub);
  user-select: none;
}
.tab.active {
  background: var(--accent);
  color: #fff;
}
.tab:hover:not(.active) { color: var(--text); }

/* Group selector */
.group-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.group-btn {
  flex: 1;
  min-width: 70px;
  padding: 8px 12px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  cursor: pointer;
  text-align: center;
  font-size: 0.82rem;
  transition: all 0.2s;
  color: var(--text);
}
.group-btn.active {
  border-color: var(--accent);
  background: #fdf3ef;
  color: var(--accent);
  font-weight: 600;
}
.group-btn:hover { border-color: var(--accent); }

/* Progress bar */
.progress-wrap {
  margin-bottom: 20px;
}
.progress-text {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  color: var(--sub);
  margin-bottom: 6px;
}
.progress-bar {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width 0.3s;
}

/* Card */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 32px 28px;
  box-shadow: var(--shadow);
  text-align: center;
  min-height: 320px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
}
.word-display {
  font-size: 2.2rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  margin-bottom: 4px;
}
  .word-pos {
    font-size: 0.9rem;
    color: var(--sub);
    font-style: italic;
    margin-bottom: 28px;
  }
  .audio-btn {
    width: 88px;
    height: 88px;
    border: none;
    border-radius: 50%;
    background: #fdf3ef;
    color: var(--accent);
    font-size: 2rem;
    cursor: pointer;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: transform 0.15s, background 0.15s;
  }
  .audio-btn:hover { background: #f8e4db; }
  .audio-btn.playing { transform: scale(1.06); background: #f8e4db; }
  .spell-hint {
    font-size: 0.9rem;
    color: var(--sub);
    margin-bottom: 20px;
  }
  .spell-form {
    width: 100%;
    max-width: 460px;
  }
  .spell-input {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 1.15rem;
    text-align: center;
    letter-spacing: 0.04em;
    outline: none;
    background: #fafaf8;
    color: var(--text);
  }
  .spell-input:focus { border-color: var(--accent); }
  .spell-input.correct { border-color: var(--green); background: var(--green-bg); color: var(--green); }
  .spell-input.wrong { border-color: var(--red); background: var(--red-bg); color: var(--red); }
  .spell-feedback {
    margin-top: 10px;
    font-size: 0.9rem;
    min-height: 1.2em;
  }

/* Options */
.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: 100%;
  max-width: 460px;
}
.option {
  padding: 14px 16px;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: #fafaf8;
  cursor: pointer;
  font-size: 0.95rem;
  transition: all 0.15s;
  text-align: center;
  color: var(--text);
}
.option:hover { border-color: var(--accent); background: #fdf3ef; }
.option.correct { border-color: var(--green); background: var(--green-bg); color: var(--green); font-weight: 600; }
.option.wrong { border-color: var(--red); background: var(--red-bg); color: var(--red); }
.option:disabled { pointer-events: none; opacity: 0.85; }

/* Answer panel */
.answer-panel {
  margin-top: 24px;
  padding: 20px;
  background: #fafaf8;
  border-radius: 10px;
  border: 1px solid var(--border);
  width: 100%;
  max-width: 460px;
  text-align: left;
  display: none;
}
.answer-panel.show { display: block; }
.answer-panel .syn-line {
  font-size: 0.9rem;
  color: var(--text);
  margin-bottom: 12px;
  line-height: 1.6;
}
.answer-panel .syn-line strong { color: var(--accent); }
.answer-panel .chinese-line {
  font-size: 0.9rem;
  color: var(--sub);
  margin-bottom: 8px;
}
.answer-panel .ielts-line {
  font-size: 0.82rem;
  color: #6b9080;
  background: #f0f7f4;
  padding: 10px 12px;
  border-radius: 8px;
  line-height: 1.5;
}
.answer-panel .example-line {
  font-size: 0.85rem;
  color: #5b6d82;
  font-style: italic;
  margin-top: 8px;
  padding: 8px 12px;
  background: #f4f6f9;
  border-radius: 6px;
  border-left: 3px solid #8fa4b8;
  line-height: 1.5;
}
.next-btn {
  display: block;
  width: 100%;
  margin-top: 16px;
  padding: 12px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}
.next-btn:hover { background: var(--accent-hover); }

/* End test button */
.end-test-btn {
  display: block;
  width: 100%;
  max-width: 460px;
  margin-top: 16px;
  padding: 10px;
  background: transparent;
  color: var(--sub);
  border: 1px dashed var(--border);
  border-radius: 8px;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s;
}
.end-test-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Test result */
.result-card {
  text-align: center;
}
.result-score {
  font-size: 3rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 8px;
}
.result-detail {
  font-size: 0.9rem;
  color: var(--sub);
  margin-bottom: 20px;
}
.mistake-list {
  width: 100%;
  text-align: left;
  max-height: 300px;
  overflow-y: auto;
  margin-bottom: 20px;
}
.mistake-item {
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 8px;
  font-size: 0.88rem;
  cursor: pointer;
  background: #fafaf8;
}
.mistake-item .q-word { font-weight: 700; color: var(--accent); }
.mistake-item .detail { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); color: var(--sub); font-size: 0.82rem; }
.mistake-item.open .detail { display: block; }

.btn-secondary {
  padding: 10px 24px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.2s;
  color: var(--text);
}
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

/* Complete banner */
.complete-banner {
  text-align: center;
  padding: 40px 20px;
}
.complete-banner h2 { font-size: 1.4rem; margin-bottom: 12px; }
.complete-banner p { color: var(--sub); font-size: 0.9rem; margin-bottom: 20px; }

/* Search */
.search-wrap {
  position: relative;
  margin-bottom: 16px;
}
.search-input {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: 0.9rem;
  background: var(--card);
  color: var(--text);
  transition: border-color 0.2s;
  outline: none;
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: #c0b8a8; }
.search-results {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  max-height: 360px;
  overflow-y: auto;
  z-index: 10;
  margin-top: 4px;
}
.search-results.show { display: block; }
.search-result-item {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
  text-align: left;
}
.search-result-item:last-child { border-bottom: none; }
.search-result-item:hover { background: #faf8f5; }
.search-result-item .sr-word {
  font-weight: 700;
  font-size: 1rem;
  color: var(--text);
}
.search-result-item .sr-pos {
  font-size: 0.8rem;
  color: var(--sub);
  font-style: italic;
  margin-left: 6px;
}
.search-result-item .sr-group {
  font-size: 0.72rem;
  color: var(--accent);
  background: #fdf3ef;
  padding: 2px 8px;
  border-radius: 4px;
  float: right;
}
.search-result-item .sr-synonyms {
  font-size: 0.82rem;
  color: var(--sub);
  margin-top: 4px;
}
.search-result-item .sr-chinese {
  font-size: 0.82rem;
  color: var(--text);
  margin-top: 2px;
}
.search-result-item .sr-example {
  font-size: 0.78rem;
  color: #5b6d82;
  font-style: italic;
  margin-top: 4px;
  padding-left: 8px;
  border-left: 2px solid var(--border);
}
.search-no-results {
  padding: 20px;
  text-align: center;
  color: var(--sub);
  font-size: 0.9rem;
}

/* Responsive */
@media (max-width: 480px) {
  .card { padding: 24px 18px; }
  .word-display { font-size: 1.7rem; }
  .options { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>单词模块</h1>
        <div class="subtitle">错词表 · 538 考点词 · 听力听写 · d阅读错词 · d听力单词</div>
  </div>
  <div class="page-nav"><a class="home-link" href="index.html">← 返回模块选择</a></div>

  <!-- Mode tabs -->
  <div class="tabs" id="tabs">
    <div class="tab active" data-mode="study" id="tab-study">背诵模式</div>
    <div class="tab" data-mode="test" id="tab-test">测试模式</div>
  </div>

  <!-- Bank (word-book) selector -->
  <div class="group-row" id="bankRow" style="margin-bottom:12px"></div>

  <!-- Group selector -->
  <div class="group-row" id="groupRow"></div>

  <!-- Search -->
  <div class="search-wrap" id="searchWrap">
    <input type="text" class="search-input" id="searchInput" placeholder="搜索单词或中文含义...">
    <div class="search-results" id="searchResults"></div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-text"><span id="progressLabel">进度</span><span id="progressCount">0 / 0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <!-- Main card -->
  <div class="card" id="card"></div>
</div>

<script src="data.js"></script>
<script>
(function() {
  const DATA = window.__VOCAB_DATA__;
  if (!DATA) { document.getElementById('card').innerHTML = '<p style="color:var(--red)">数据加载失败，请确保 data.js 文件存在。</p>'; return; }

  // ===== State =====
  let mode = 'study';         // 'study' | 'test'
  let bankIdx = 0;            // 当前词库下标，进度按 bank.id 独立记忆
  let groupIdx = 0;           // current group within the bank
  let studyIdx = 0;           // current word index in study mode
  let answered = false;       // whether current question has been answered
  let testQuestions = [];     // shuffled questions for test mode
  let testIdx = 0;
  let testAnswers = [];       // { wordId, correct, userPicked }
      let optionBtns = [];
      let autoAdvanceTimer = null;
      let wordAudio = null;

  // ===== localStorage =====
  function storageKey(key) { return 'vocab-' + key; }
  function loadProgress() {
    try {
      const raw = localStorage.getItem(storageKey('progress'));
      return raw ? JSON.parse(raw) : {};
    } catch(e) { return {}; }
  }
  function saveProgress(p) {
    try { localStorage.setItem(storageKey('progress'), JSON.stringify(p)); } catch(e) {}
  }
  let progress = loadProgress();
  // 每个词库进度独立：{ [bankId]: { study: {groupIdx: idx}, mistakes: {wordId: count} } }
  function bankProgress() {
    const id = currentBank().id;
    if (!progress[id]) progress[id] = { study: {}, mistakes: {} };
    return progress[id];
  }

  // ===== Helpers =====
      function currentBank() { return DATA.banks[bankIdx]; }
      function currentGroup() { return currentBank().groups[groupIdx]; }
      function currentWords() { return currentGroup().words; }
      function allBankWords() { return DATA.banks.flatMap(b => b.groups.flatMap(g => g.words)); }
      // 当前词库是否为听音拼写
      function isSpellQuiz() { return currentBank().quiz === 'spell'; }
      // 统一拼写后再比对
      function normalizeSpell(s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); }
      // 停止当前单词音频
      function stopWordAudio() {
        if (!wordAudio) return;
        try { wordAudio.pause(); } catch (e) {}
        wordAudio = null;
      }
      // 播放单词英音（有道词典 type=1）
      function playWordAudio(word) {
        stopWordAudio();
        const url = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=1';
        wordAudio = new Audio(url);
        const btn = document.getElementById('btnPlay');
        if (btn) {
          wordAudio.addEventListener('play', () => btn.classList.add('playing'));
          wordAudio.addEventListener('ended', () => btn.classList.remove('playing'));
          wordAudio.addEventListener('pause', () => btn.classList.remove('playing'));
        }
        wordAudio.play().catch(() => {});
      }
      function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }

  // Generate 4 options for a word: 1 correct + 3 distractors.
  // 538考点词选同义替换；错词表选中文释义
  function generateOptions(word, allWords) {
    const synonymMode = Array.isArray(word.synonyms) && word.synonyms.length > 0;
    const correct = synonymMode
      ? word.synonyms[Math.floor(Math.random() * word.synonyms.length)]
      : word.chinese;
    const meanings = w => synonymMode ? (w.synonyms || []) : [w.chinese];
    const ok = s => s !== correct && !distractorsSet.has(s) && !(synonymMode && word.synonyms.includes(s));
    const distractorsSet = new Set();
    shuffle([...new Set(allWords.filter(w => w !== word).flatMap(meanings))].filter(ok))
      .slice(0, 3).forEach(s => distractorsSet.add(s));
    // If not enough distractors, grab from all banks
    if (distractorsSet.size < 3) {
      shuffle([...new Set(allBankWords().filter(w => w !== word).flatMap(meanings))].filter(ok))
        .slice(0, 3 - distractorsSet.size).forEach(s => distractorsSet.add(s));
    }
    const options = shuffle([correct, ...distractorsSet]);
    return { options, correct };
  }

  // ===== Render =====
  function renderBankSelector() {
    const row = document.getElementById('bankRow');
    row.innerHTML = DATA.banks.map((b, i) => {
      const total = b.groups.reduce((n, g) => n + g.words.length, 0);
      return `<button class="group-btn bank-btn${i === bankIdx ? ' active' : ''}" data-idx="${i}">${b.name}<br><small>${total}词</small></button>`;
    }).join('');
    row.querySelectorAll('.bank-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            if (parseInt(this.dataset.idx) === bankIdx) return;
            stopWordAudio();
            bankIdx = parseInt(this.dataset.idx);
        groupIdx = 0;
        studyIdx = bankProgress().study[groupIdx] || 0;
        if (mode === 'test') startTest(); else renderStudy();
        renderBankSelector();
        renderGroupSelector();
      });
    });
  }

  function renderGroupSelector() {
    const row = document.getElementById('groupRow');
    row.innerHTML = currentBank().groups.map((g, i) =>
      `<button class="group-btn${i === groupIdx ? ' active' : ''}" data-idx="${i}">${g.name}<br><small>${g.words.length}词</small></button>`
    ).join('');
    row.querySelectorAll('.group-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            stopWordAudio();
            groupIdx = parseInt(this.dataset.idx);
        studyIdx = bankProgress().study[groupIdx] || 0;
        if (mode === 'test') startTest();
        else renderStudy();
        renderGroupSelector();
      });
    });
  }

  function updateProgress() {
    const total = currentWords().length;
    if (mode === 'study') {
      document.getElementById('progressLabel').textContent = '背诵进度';
      document.getElementById('progressCount').textContent = studyIdx + ' / ' + total;
      document.getElementById('progressFill').style.width = (total ? studyIdx / total * 100 : 0) + '%';
    } else {
      document.getElementById('progressLabel').textContent = '测试进度';
      document.getElementById('progressCount').textContent = testIdx + ' / ' + testQuestions.length;
      document.getElementById('progressFill').style.width = (testQuestions.length ? testIdx / testQuestions.length * 100 : 0) + '%';
    }
  }

  // ===== STUDY MODE =====
    function renderStudy() {
      stopWordAudio();
      const words = currentWords();
      const card = document.getElementById('card');
      answered = false;

      if (!words.length) {
        const localHint = (currentBank().id === 'd-reading' || currentBank().id === 'd-listening')
          ? '请在本目录 d词表.xlsx 填入单词后运行 python 更新词库.py，再刷新本页。'
          : '本组暂无单词';
        card.innerHTML = `
          <div class="complete-banner">
            <h2>${currentBank().name} 还没有单词</h2>
            <p>${localHint}</p>
          </div>`;
        updateProgress();
        return;
      }

      if (studyIdx >= words.length) {
      // Group complete
      card.innerHTML = `
        <div class="complete-banner">
          <h2>${currentGroup().name} 背诵完成！</h2>
          <p>已学完本组全部 ${words.length} 个考点词</p>
          <button class="btn-secondary" id="btnRestart">重新背诵本组</button>
          ${groupIdx < currentBank().groups.length - 1 ? `<button class="btn-secondary" id="btnNextGroup" style="margin-left:8px">进入${currentBank().groups[groupIdx+1].name}</button>` : ''}
        </div>`;
      document.getElementById('btnRestart').addEventListener('click', () => { studyIdx = 0; renderStudy(); updateProgress(); });
      const btnNext = document.getElementById('btnNextGroup');
      if (btnNext) btnNext.addEventListener('click', () => { groupIdx++; studyIdx = 0; renderGroupSelector(); renderStudy(); updateProgress(); });
      updateProgress();
      return;
    }

      const word = words[studyIdx];
      if (isSpellQuiz()) {
        renderSpellStudy(word);
        return;
      }
      const { options, correct } = generateOptions(word, words);

    card.innerHTML = `
      <div class="word-display">${word.word}</div>
      <div class="word-pos">${word.pos || ''}</div>
      <div class="options" id="options"></div>
      <div class="answer-panel" id="answerPanel">
        <div class="syn-line">${word.synonyms ? '同义替换：' : '释义：'}<strong>${word.synonyms ? word.synonyms.join(' · ') : word.chinese}</strong></div>
        ${word.synonyms ? `<div class="chinese-line">中文：${word.chinese}</div>` : ''}
        ${word.ieltsMeaning ? `<div class="ielts-line">雅思阅读：${word.ieltsMeaning}</div>` : ''}
        ${word.source ? `<div class="ielts-line">来源：${word.source}${word.date ? ' · ' + word.date : ''}</div>` : ''}
        ${word.example ? `<div class="example-line">例句：${word.example}</div>` : ''}
        <button class="next-btn" id="btnNext">下一个 →</button>
      </div>`;

    const optsDiv = document.getElementById('options');
    optionBtns = options.map((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.textContent = opt;
      btn.addEventListener('click', () => handleStudyAnswer(opt, correct, word));
      optsDiv.appendChild(btn);
      return btn;
    });

    document.getElementById('btnNext').addEventListener('click', () => {
      studyIdx++;
      const bp = bankProgress();
      if (studyIdx > (bp.study[groupIdx] || 0)) bp.study[groupIdx] = studyIdx;
      saveProgress(progress);
      renderStudy();
      updateProgress();
    });

    updateProgress();
  }

  function handleStudyAnswer(picked, correct, word) {
    if (answered) return;
    answered = true;

    optionBtns.forEach(btn => {
      btn.disabled = true;
      if (btn.textContent === correct) btn.classList.add('correct');
      if (btn.textContent === picked && picked !== correct) btn.classList.add('wrong');
    });

    if (picked !== correct) {
      const bm = bankProgress().mistakes;
      bm[word.id] = (bm[word.id] || 0) + 1;
      saveProgress(progress);
    }

    document.getElementById('answerPanel').classList.add('show');
  }

  // 渲染听音拼写题卡
  function renderSpellCard(word, opts) {
    const card = document.getElementById('card');
    card.innerHTML = `
      <button type="button" class="audio-btn" id="btnPlay" title="播放英音">🔊</button>
      <div class="spell-hint">听音，拼出单词</div>
      <form class="spell-form" id="spellForm">
        <input class="spell-input" id="spellInput" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入拼写">
        <div class="spell-feedback" id="spellFeedback"></div>
        <button class="next-btn" type="submit" id="btnSubmit">提交</button>
      </form>
      ${opts.answerHtml || ''}
      ${opts.showEndTest ? '<button class="end-test-btn" id="btnEndTest">结束测试</button>' : ''}`;
    document.getElementById('btnPlay').addEventListener('click', () => playWordAudio(word.word));
    playWordAudio(word.word);
    document.getElementById('spellForm').addEventListener('submit', e => {
      e.preventDefault();
      const typed = document.getElementById('spellInput').value;
      if (!typed.trim()) return;
      opts.onSubmit(typed);
    });
    if (opts.showEndTest) {
      document.getElementById('btnEndTest').addEventListener('click', () => endTest());
    }
    const input = document.getElementById('spellInput');
    if (input) input.focus();
  }

  // 背诵模式：听写一题
  function renderSpellStudy(word) {
    renderSpellCard(word, {
      answerHtml: `
        <div class="answer-panel" id="answerPanel">
          <div class="word-display" style="font-size:1.6rem;margin-bottom:8px">${word.word}</div>
          <div class="syn-line">释义：<strong>${word.chinese}</strong></div>
          ${word.source ? `<div class="ielts-line">来源：${word.source}${word.date ? ' · ' + word.date : ''}</div>` : ''}
          ${word.example ? `<div class="example-line">例句：${word.example}</div>` : ''}
          <button class="next-btn" id="btnNext">下一个 →</button>
        </div>`,
      onSubmit: typed => handleSpellStudyAnswer(typed, word)
    });
    document.getElementById('btnNext').addEventListener('click', () => {
      studyIdx++;
      const bp = bankProgress();
      if (studyIdx > (bp.study[groupIdx] || 0)) bp.study[groupIdx] = studyIdx;
      saveProgress(progress);
      renderStudy();
      updateProgress();
    });
    updateProgress();
  }

  // 判定背诵听写对错并展开答案卡
  function handleSpellStudyAnswer(typed, word) {
    if (answered) return;
    answered = true;
    const input = document.getElementById('spellInput');
    const ok = normalizeSpell(typed) === normalizeSpell(word.word);
    input.disabled = true;
    input.classList.add(ok ? 'correct' : 'wrong');
    document.getElementById('btnSubmit').style.display = 'none';
    if (!ok) {
      document.getElementById('spellFeedback').innerHTML = `正确答案：<strong>${word.word}</strong>`;
      document.getElementById('spellFeedback').style.color = 'var(--red)';
      const bm = bankProgress().mistakes;
      bm[word.id] = (bm[word.id] || 0) + 1;
      saveProgress(progress);
    }
    document.getElementById('answerPanel').classList.add('show');
    const btnNext = document.getElementById('btnNext');
    if (btnNext) btnNext.focus();
  }

  // ===== TEST MODE =====
  function startTest() {
    stopWordAudio();
    clearTimeout(autoAdvanceTimer);
    const words = currentWords();
    if (isSpellQuiz()) {
      testQuestions = shuffle(words.map(w => ({ word: w, correct: w.word })));
    } else {
      testQuestions = shuffle(words.map(w => {
        const { options, correct } = generateOptions(w, words);
        return { word: w, options, correct };
      }));
    }
    testIdx = 0;
    testAnswers = [];
    renderTestQuestion();
    updateProgress();
  }

  function renderTestQuestion() {
    stopWordAudio();
    const card = document.getElementById('card');
    answered = false;

    if (testIdx >= testQuestions.length) {
      showTestResult();
      return;
    }

    const q = testQuestions[testIdx];
    if (isSpellQuiz()) {
      renderSpellCard(q.word, {
        showEndTest: true,
        onSubmit: typed => handleSpellTestAnswer(typed, q)
      });
      updateProgress();
      return;
    }
    card.innerHTML = `
      <div class="word-display">${q.word.word}</div>
      <div class="word-pos">${q.word.pos || ''}</div>
      <div class="options" id="options"></div>
      <button class="end-test-btn" id="btnEndTest">结束测试</button>`;

    const optsDiv = document.getElementById('options');
    optionBtns = q.options.map(opt => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.textContent = opt;
      btn.addEventListener('click', () => handleTestAnswer(opt, q));
      optsDiv.appendChild(btn);
      return btn;
    });

    document.getElementById('btnEndTest').addEventListener('click', () => endTest());

    updateProgress();
  }

  function handleTestAnswer(picked, q) {
    if (answered) return;
    answered = true;

    const correct = q.correct;
    const isCorrect = picked === correct;
    testAnswers.push({ word: q.word, correct, userPicked: picked, isCorrect });

    optionBtns.forEach(btn => {
      btn.disabled = true;
      if (btn.textContent === correct) btn.classList.add('correct');
      if (btn.textContent === picked && !isCorrect) btn.classList.add('wrong');
    });

    if (!isCorrect) {
      const bm = bankProgress().mistakes;
      bm[q.word.id] = (bm[q.word.id] || 0) + 1;
      saveProgress(progress);
    }

    // Auto advance after short delay
    autoAdvanceTimer = setTimeout(() => {
      testIdx++;
      renderTestQuestion();
    }, 800);
  }

  // 判定测试听写对错并短暂展示答案
  function handleSpellTestAnswer(typed, q) {
    if (answered) return;
    answered = true;
    const correct = q.correct;
    const isCorrect = normalizeSpell(typed) === normalizeSpell(correct);
    testAnswers.push({ word: q.word, correct, userPicked: typed.trim(), isCorrect });
    const input = document.getElementById('spellInput');
    input.disabled = true;
    input.classList.add(isCorrect ? 'correct' : 'wrong');
    document.getElementById('btnSubmit').style.display = 'none';
    const fb = document.getElementById('spellFeedback');
    fb.innerHTML = isCorrect ? '拼写正确' : `正确答案：<strong>${correct}</strong>`;
    fb.style.color = isCorrect ? 'var(--green)' : 'var(--red)';
    if (!isCorrect) {
      const bm = bankProgress().mistakes;
      bm[q.word.id] = (bm[q.word.id] || 0) + 1;
      saveProgress(progress);
    }
    autoAdvanceTimer = setTimeout(() => {
      testIdx++;
      renderTestQuestion();
    }, 1200);
  }

  function endTest() {
    stopWordAudio();
    clearTimeout(autoAdvanceTimer);
    testIdx = testQuestions.length;
    showTestResult();
  }

  function showTestResult() {
    stopWordAudio();
    const card = document.getElementById('card');
    const total = testAnswers.length;
    if (total === 0) {
      card.innerHTML = `
        <div class="result-card">
          <p style="color:var(--sub);font-size:1.1rem;margin-bottom:20px">还没有回答任何题目</p>
          <button class="btn-secondary" id="btnRetest">继续测试</button>
        </div>`;
      updateProgress();
      document.getElementById('btnRetest').addEventListener('click', () => startTest());
      return;
    }
    const correct = testAnswers.filter(a => a.isCorrect).length;
    const mistakes = testAnswers.filter(a => !a.isCorrect);
    const pct = Math.round(correct / total * 100);

    card.innerHTML = `
      <div class="result-card">
        <div class="result-score">${correct} / ${total}</div>
        <div class="result-detail">正确率 ${pct}%${pct >= 80 ? ' — 优秀！' : pct >= 60 ? ' — 继续加油' : ' — 多背背再来'}</div>
        ${mistakes.length > 0 ? `
          <div class="mistake-list">
            ${mistakes.map(m => `
              <div class="mistake-item" data-wid="${m.word.id}">
                <span class="q-word">${m.word.word}</span>${m.word.pos ? ` (${m.word.pos})` : ''}
                — ${isSpellQuiz() ? '你拼了' : '你选了'} <span style="color:var(--red)">${m.userPicked}</span>
                <div class="detail">
                  正确答案：<strong>${m.correct}</strong>
                  ${m.word.synonyms ? `<br>全部同义词：${m.word.synonyms.join(' · ')}<br>中文：${m.word.chinese}` : `<br>中文：${m.word.chinese}`}
                  ${m.word.source ? `<br>来源：${m.word.source}${m.word.date ? ' · ' + m.word.date : ''}` : ''}
                  ${m.word.example ? `<br>例句：${m.word.example}` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        ` : `<p style="color:var(--green);margin-bottom:20px">全部正确！</p>`}
        <button class="btn-secondary" id="btnRetest">重新测试</button>
        <button class="btn-secondary" id="btnRetestMistakes" style="margin-left:8px"${mistakes.length===0?' disabled':''}>只测错题 (${mistakes.length})</button>
      </div>`;

    document.getElementById('btnRetest').addEventListener('click', () => startTest());
    if (mistakes.length > 0) {
      document.getElementById('btnRetestMistakes').addEventListener('click', () => {
        testQuestions = shuffle(mistakes.map(m => {
          if (isSpellQuiz()) return { word: m.word, correct: m.word.word };
          const { options, correct } = generateOptions(m.word, currentWords());
          return { word: m.word, options, correct };
        }));
        testIdx = 0;
        testAnswers = [];
        renderTestQuestion();
        updateProgress();
      });
    }

    // Click to expand mistake details
    card.querySelectorAll('.mistake-item').forEach(item => {
      item.addEventListener('click', () => item.classList.toggle('open'));
    });

    updateProgress();
  }

  // ===== Mode switching =====
  function switchMode(newMode) {
    stopWordAudio();
    mode = newMode;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
    if (mode === 'study') {
      studyIdx = bankProgress().study[groupIdx] || 0;
      renderStudy();
    } else {
      startTest();
    }
  }

  document.getElementById('tabs').addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    switchMode(tab.dataset.mode);
  });

  // ===== SEARCH =====
  function performSearch(query) {
    const q = query.trim().toLowerCase();
    const resultsDiv = document.getElementById('searchResults');
    if (q.length < 1) {
      resultsDiv.innerHTML = '';
      resultsDiv.classList.remove('show');
      return;
    }
    const allWords = [];
    DATA.banks.forEach(b => b.groups.forEach(g => g.words.forEach(w => allWords.push({ ...w, bankName: b.name }))));
    const results = allWords.filter(w => {
      return w.word.toLowerCase().includes(q) ||
        (w.chinese || '').includes(q) ||
        (w.synonyms || []).some(s => s.toLowerCase().includes(q));
    });
    renderSearchResults(results.slice(0, 20));
  }

  function renderSearchResults(results) {
    const div = document.getElementById('searchResults');
    if (results.length === 0) {
      div.innerHTML = '<div class="search-no-results">未找到匹配的单词</div>';
      div.classList.add('show');
      return;
    }
    div.innerHTML = results.map(w => `
      <div class="search-result-item">
        <span class="sr-group">${w.bankName}</span>
        <span class="sr-word">${w.word}</span>
        ${w.pos ? `<span class="sr-pos">${w.pos}</span>` : ''}
        ${w.synonyms ? `<div class="sr-synonyms">同义：${w.synonyms.join(' · ')}</div>` : ''}
        ${w.chinese ? `<div class="sr-chinese">中文：${w.chinese}</div>` : ''}
        ${w.example ? `<div class="sr-example">例句：${w.example}</div>` : ''}
        ${w.source ? `<div class="sr-example">来源：${w.source}${w.date ? ' · ' + w.date : ''}</div>` : ''}
      </div>
    `).join('');
    div.classList.add('show');
  }

  // ===== Init =====
  function init() {
    renderBankSelector();
    renderGroupSelector();
    studyIdx = bankProgress().study[groupIdx] || 0;
    renderStudy();

    // Search events
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', () => performSearch(searchInput.value));
    searchInput.addEventListener('focus', () => {
      if (searchInput.value.trim()) performSearch(searchInput.value);
    });
    searchInput.addEventListener('blur', () => {
      setTimeout(() => {
        document.getElementById('searchResults').classList.remove('show');
      }, 150);
    });
    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        searchInput.value = '';
        document.getElementById('searchResults').classList.remove('show');
      }
    });
  }
  init();
})();
</script>
</body>
</html>
