<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Derrick 的 IELTS 备考站 — 口语</title>
<style>
:root {
  --bg: #f5f0eb;
  --card: #ffffff;
  --text: #2c2416;
  --sub: #8b7355;
  --accent: #c75b39;
  --accent-hover: #a0482e;
  --border: #e0d5c7;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 20px;
}
.container { width: 100%; max-width: 640px; }
.header { text-align: center; margin: 36px 0 20px; }
.header h1 { font-size: 1.7rem; letter-spacing: 0.02em; }
.header .subtitle { color: var(--sub); font-size: 0.88rem; margin-top: 7px; line-height: 1.6; }
.page-nav { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
.home-link { color: var(--sub); font-size: 0.85rem; text-decoration: none; }
.home-link:hover { color: var(--accent); }
.card-list { display: grid; gap: 14px; }
.module-card {
  display: block;
  width: 100%;
  padding: 22px 24px;
  background: var(--card);
  border: 1.5px solid transparent;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  color: var(--text);
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  font: inherit;
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.module-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}
.module-card h2 { font-size: 1.05rem; margin-bottom: 6px; }
.module-card p { color: var(--sub); font-size: 0.86rem; line-height: 1.6; }
.module-arrow { float: right; color: var(--accent); font-size: 1.15rem; margin-top: 2px; }
.detail {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px 22px 28px;
}
.detail-intro {
  color: var(--sub);
  font-size: 0.9rem;
  line-height: 1.7;
  margin-bottom: 18px;
}
.block {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 12px;
  background: #fafaf8;
}
.block h3 { font-size: 1.02rem; margin-bottom: 4px; }
.block .en-name { color: var(--accent); font-size: 0.78rem; margin-bottom: 12px; }
.block h4 {
  font-size: 0.78rem;
  color: var(--sub);
  letter-spacing: 0.04em;
  margin: 12px 0 6px;
}
.speech {
  font-size: 0.95rem;
  line-height: 1.7;
  color: var(--text);
}
.zh {
  font-size: 0.88rem;
  line-height: 1.7;
  color: var(--sub);
}
.phrases { display: grid; gap: 8px; margin-top: 4px; }
.phrase {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 10px;
  background: #fff;
  border-radius: 8px;
  border: 1px solid var(--border);
  font-size: 0.84rem;
}
.phrase .en { color: var(--accent); font-weight: 600; }
.phrase .zh { color: var(--sub); text-align: right; }
.note { font-size: 0.82rem; color: #6b9080; margin-top: 8px; }
.article-block { margin-bottom: 18px; }
.article-block:last-child { margin-bottom: 0; }
.article-block h3 { font-size: 1rem; margin-bottom: 8px; }
.article-block p, .article-block li {
  color: var(--text);
  font-size: 0.9rem;
  line-height: 1.75;
  margin-bottom: 8px;
}
.article-block ul { padding-left: 1.1em; }
.qa { border-top: 1px dashed var(--border); padding-top: 14px; margin-top: 14px; }
.qa:first-child { border-top: none; padding-top: 0; margin-top: 0; }
.qa .q { font-weight: 700; margin-bottom: 8px; }
.block ul { padding-left: 1.1em; margin-top: 4px; }
.block li {
  color: var(--text);
  font-size: 0.88rem;
  line-height: 1.7;
  margin-bottom: 4px;
}
.logic-line { font-size: 0.88rem; line-height: 1.7; color: var(--text); margin-bottom: 8px; }
.logic-line .when { color: var(--accent); font-weight: 600; }
.placeholder {
  color: var(--sub);
  font-size: 0.92rem;
  line-height: 1.7;
  text-align: center;
  padding: 28px 8px;
}
.empty { color: var(--sub); text-align: center; padding: 40px 12px; }
/* ===== 考场演练 ===== */
.drill-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.drill-check {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  color: var(--sub);
  cursor: pointer;
}
.drill-stat { font-size: 0.78rem; color: var(--sub); }
.link-btn {
  border: none;
  background: none;
  padding: 0;
  color: var(--sub);
  font: inherit;
  font-size: 0.78rem;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.link-btn:hover { color: var(--accent); }
.btn {
  display: inline-block;
  padding: 10px 18px;
  border: none;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font: inherit;
  font-size: 0.9rem;
  cursor: pointer;
}
.btn:hover { background: var(--accent-hover); }
.btn.secondary { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.btn.secondary:hover { background: #fdf3ef; }
.drill-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.badge {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 0.72rem;
  vertical-align: 2px;
  margin-left: 8px;
}
.badge.new { background: var(--accent); color: #fff; }
.badge.retained { background: var(--border); color: #6b5d4a; }
.badge.classic { background: #6b9080; color: #fff; }
.cue-card {
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 12px;
}
.cue-card h3 { font-size: 1.02rem; margin-bottom: 8px; }
.cue-card .speech { margin-bottom: 10px; }
.cue-card ul { padding-left: 0; list-style: none; }
.countdown {
  font-size: 3.4rem;
  font-weight: 700;
  text-align: center;
  font-variant-numeric: tabular-nums;
  margin: 10px 0 4px;
}
.countdown.warn { color: #c0392b; }
.timer-caption { text-align: center; color: var(--sub); font-size: 0.8rem; margin-bottom: 6px; }
.qidx { font-size: 0.8rem; color: var(--sub); margin-bottom: 10px; }
.qitem {
  padding: 10px 12px;
  margin-bottom: 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
  font-size: 0.92rem;
  line-height: 1.6;
  cursor: pointer;
}
.qitem.current { border-color: var(--accent); background: #fdf3ef; }
.stage { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.stage span {
  padding: 3px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  font-size: 0.78rem;
  color: var(--sub);
}
.stage span.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.drill-total { margin-left: auto; font-size: 0.78rem; color: var(--sub); font-variant-numeric: tabular-nums; }
@media (max-width: 480px) {
  .header { margin-top: 20px; }
  .module-card, .detail { padding: 18px 16px; }
  .phrase { flex-direction: column; gap: 4px; }
  .phrase .zh { text-align: left; }
}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <h1 id="pageTitle">口语模块</h1>
    <p class="subtitle" id="pageSubtitle">语言习惯、P1 / P2 / P3 资料与考场演练</p>
  </header>
  <nav class="page-nav" id="pageNav"></nav>
  <main id="app"></main>
</div>
<script src="speaking-questions.js"></script>
<script src="speaking-data.js"></script>
<script>
(function () {
  const DATA = window.__SPEAKING_DATA__;
  const app = document.getElementById('app');
  const titleEl = document.getElementById('pageTitle');
  const subtitleEl = document.getElementById('pageSubtitle');
  const navEl = document.getElementById('pageNav');

  if (!DATA || !DATA.sections) {
    app.innerHTML = '<p class="empty">数据加载失败，请确保 speaking-data.js 存在。</p>';
    return;
  }

  // 转义文本后再写入 HTML
  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // 从 hash 读出当前部分、卡片和子卡片
  function parseHash() {
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    return { sectionId: parts[0] || '', cardId: parts[1] || '', nestedId: parts[2] || '' };
  }

  // 按 id 取部分
  function findSection(id) {
    return DATA.sections.find(section => section.id === id);
  }

  // 按 id 取卡片
  function findCard(section, id) {
    return (section.cards || []).find(card => card.id === id);
  }

  // 按 id 取剧本组里的子卡片
  function findNestedCard(card, id) {
    return (card.cards || []).find(item => item.id === id);
  }

  // 画顶部返回链接
  function renderNav(section, card, nested) {
    const links = ['<a class="home-link" href="index.html">← 返回模块选择</a>'];
    if (nested) {
      links.push('<a class="home-link" href="#/' + encodeURIComponent(section.id) + '">← 返回' + esc(section.name) + '</a>');
      links.push('<a class="home-link" href="#/' + encodeURIComponent(section.id) + '/' + encodeURIComponent(card.id) + '">← 返回' + esc(card.title) + '</a>');
    } else if (card) {
      links.push('<a class="home-link" href="#/' + encodeURIComponent(section.id) + '">← 返回' + esc(section.name) + '</a>');
    } else if (section) {
      links.push('<a class="home-link" href="#">← 返回口语首页</a>');
    }
    navEl.innerHTML = links.join('');
  }

  // 画一张可点击的入口卡
  function renderEntryCard(href, title, summary) {
    return '<a class="module-card" href="' + href + '">' +
      '<span class="module-arrow">→</span>' +
      '<h2>' + esc(title) + '</h2>' +
      (summary ? '<p>' + esc(summary) + '</p>' : '') +
      '</a>';
  }

  // 画五个部分的入口
  function renderHome() {
    titleEl.textContent = '口语模块';
    subtitleEl.textContent = '先选一个部分，再点进对应卡片';
    renderNav(null, null);
    app.innerHTML = '<div class="card-list">' + DATA.sections.map(section => {
      const count = (section.cards || []).length;
      const summary = (section.summary || '') + (count ? ' · ' + count + ' 张卡片' : '');
      return renderEntryCard('#/' + encodeURIComponent(section.id), section.name, summary);
    }).join('') + '</div>';
  }

  // 画一个部分里的卡片列表
  function renderSection(section) {
    titleEl.textContent = section.name;
    subtitleEl.textContent = section.summary || '点进卡片查看内容';
    renderNav(section, null);
    const cards = section.cards || [];
    if (!cards.length) {
      app.innerHTML = '<p class="empty">这个部分还没有卡片。</p>';
      return;
    }
    app.innerHTML = '<div class="card-list">' + cards.map(card => {
      const summary = cardSummary(card);
      return renderEntryCard('#/' + encodeURIComponent(section.id) + '/' + encodeURIComponent(card.id), card.title, summary);
    }).join('') + '</div>';
  }

  // 给入口卡写一句摘要
  function cardSummary(card) {
    if (card.type === 'persona') return '5 个模块 + 2 个万能补丁';
    if (card.type === 'group') return ((card.cards || []).length || 0) + ' 个剧本';
    if (card.type === 'script') return card.hook || '万能故事母带';
    if (card.type === 'topic') return ((card.questions || []).length || 0) + ' 道真题';
    if (card.type === 'article') return ((card.blocks || []).length || 0) + ' 个要点';
    if (card.summary) return card.summary;
    if (card.type === 'placeholder') return '内容待整理';
    return '';
  }

  // 画一组子卡片，例如三个剧本
  function renderGroup(section, card) {
    titleEl.textContent = card.title;
    subtitleEl.textContent = card.summary || section.name;
    renderNav(section, card, null);
    const cards = card.cards || [];
    if (!cards.length) {
      app.innerHTML = '<p class="empty">这个部分还没有卡片。</p>';
      return;
    }
    const intro = card.intro ? '<p class="detail-intro" style="margin-bottom:14px">' + esc(card.intro) + '</p>' : '';
    app.innerHTML = intro + '<div class="card-list">' + cards.map(item => {
      const href = '#/' + encodeURIComponent(section.id) + '/' + encodeURIComponent(card.id) + '/' + encodeURIComponent(item.id);
      return renderEntryCard(href, item.title, cardSummary(item));
    }).join('') + '</div>';
  }

  // 画卡片正文
  function renderCard(section, card, parent) {
    titleEl.textContent = card.title;
    subtitleEl.textContent = parent ? parent.title : section.name;
    renderNav(section, parent || card, parent ? card : null);
    if (card.type === 'persona') app.innerHTML = renderPersona(card);
    else if (card.type === 'article') app.innerHTML = renderArticle(card);
    else if (card.type === 'topic') app.innerHTML = renderTopic(card);
    else if (card.type === 'script') app.innerHTML = renderScript(card);
    else if (card.type === 'drill') return renderDrillPage(section, card);
    else app.innerHTML = '<div class="detail"><p class="placeholder">' + esc(card.text || '内容待整理。') + '</p></div>';
  }

  // 画人设语料：五个模块和两个补丁
  function renderPersona(card) {
    const modules = (card.modules || []).map(module => {
      const phrases = (module.phrases || []).map(item =>
        '<div class="phrase"><span class="en">' + esc(item.en) + '</span><span class="zh">' + esc(item.zh) + '</span></div>'
      ).join('');
      return '<article class="block">' +
        '<h3>模块' + esc(module.index) + '：' + esc(module.name) + '</h3>' +
        '<div class="en-name">' + esc(module.enName) + '</div>' +
        '<h4>必背语料</h4><p class="speech">“' + esc(module.speech) + '”</p>' +
        '<h4>中文翻译</h4><p class="zh">' + esc(module.zh) + '</p>' +
        '<h4>提分词伙</h4><div class="phrases">' + phrases + '</div>' +
        '</article>';
    }).join('');
    const patches = (card.patches || []).map(patch =>
      '<article class="block">' +
        '<h3>' + esc(patch.name) + '</h3>' +
        '<div class="en-name">' + esc(patch.scene) + '</div>' +
        '<h4>话术</h4><p class="speech">“' + esc(patch.speech) + '”</p>' +
        '<h4>中文翻译</h4><p class="zh">' + esc(patch.zh) + '</p>' +
        (patch.note ? '<p class="note">' + esc(patch.note) + '</p>' : '') +
        '</article>'
    ).join('');
    return '<div class="detail">' +
      (card.intro ? '<p class="detail-intro">' + esc(card.intro) + '</p>' : '') +
      modules +
      '<p class="detail-intro" style="margin:18px 0 12px">2 个万能逻辑补丁，用来处理特殊情况。</p>' +
      patches +
      '</div>';
  }

  // 画说明类卡片
  function renderArticle(card) {
    const blocks = (card.blocks || []).map(block => {
      const paragraphs = (block.paragraphs || []).map(text => '<p>' + esc(text) + '</p>').join('');
      const list = block.list && block.list.length
        ? '<ul>' + block.list.map(item => '<li>' + esc(item) + '</li>').join('') + '</ul>'
        : '';
      return '<section class="article-block">' +
        (block.heading ? '<h3>' + esc(block.heading) + '</h3>' : '') +
        paragraphs + list +
        '</section>';
    }).join('');
    return '<div class="detail">' + blocks + '</div>';
  }

  // 画一类 P1 题目：真题和对应答案
  function renderTopic(card) {
    const questions = card.questions || [];
    if (!questions.length) {
      return '<div class="detail"><p class="placeholder">这类题目的真题和人设答案还没整理。</p></div>';
    }
    const items = questions.map(item =>
      '<article class="qa">' +
        '<p class="q">' + esc(item.q) + '</p>' +
        (item.a ? '<p class="speech">' + esc(item.a) + '</p>' : '') +
        (item.zh ? '<p class="zh">' + esc(item.zh) + '</p>' : '') +
        (item.note ? '<p class="note">' + esc(item.note) + '</p>' : '') +
        '</article>'
    ).join('');
    return '<div class="detail">' +
      (card.intro ? '<p class="detail-intro">' + esc(card.intro) + '</p>' : '') +
      items +
      '</div>';
  }

  // 画一个万能剧本：话题、逻辑、梗概、母带
  function renderScript(card) {
    const topics = card.topics || {};
    const cover = (topics.cover || []).map(item => '<li>' + esc(item) + '</li>').join('');
    const logicItems = (card.logicItems || []).map(item =>
      '<p class="logic-line"><span class="when">' + esc(item.when) + '</span> ' + esc(item.then) + '</p>'
    ).join('');
    const parts = (card.parts || []).map(part =>
      '<article class="block">' +
        '<h3>' + esc(part.name) + '</h3>' +
        (part.scene ? '<div class="en-name">' + esc(part.scene) + '</div>' : '') +
        '<h4>英文母带</h4><p class="speech">' + esc(part.speech) + '</p>' +
        '<h4>中文翻译</h4><p class="zh">' + esc(part.zh) + '</p>' +
        '</article>'
    ).join('');
    return '<div class="detail">' +
      (card.intro ? '<p class="detail-intro">' + esc(card.intro) + '</p>' : '') +
      '<article class="block">' +
        '<h3>话题</h3>' +
        '<p class="note">' + esc(topics.status || '持续更新中') + '</p>' +
        (cover ? '<h4>可覆盖</h4><ul>' + cover + '</ul>' : '') +
      '</article>' +
      '<article class="block">' +
        '<h3>1 核心逻辑</h3>' +
        (card.logic ? '<p class="speech">' + esc(card.logic) + '</p>' : '') +
        logicItems +
      '</article>' +
      '<article class="block">' +
        '<h3>2 故事梗概</h3>' +
        '<p class="zh">' + esc(card.plot || '') + '</p>' +
      '</article>' +
      '<article class="block">' +
        '<h3>3 必背：万能故事母带</h3>' +
        (card.masterNote ? '<p class="zh">' + esc(card.masterNote) + '</p>' : '') +
        (card.audioNote ? '<p class="note">' + esc(card.audioNote) + '</p>' : '') +
      '</article>' +
      parts +
      '</div>';
  }

  // ===== 考场演练 =====
  const QB = window.__SPEAKING_QUESTIONS__;
  const DRILL_KEY = 'ielts-speaking-drill-v1';
  let drillTimers = [];

  function clearDrillTimers() {
    drillTimers.forEach(clearInterval);
    drillTimers = [];
  }

  function drillState() {
    try { return JSON.parse(localStorage.getItem(DRILL_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveDrillState(state) {
    localStorage.setItem(DRILL_KEY, JSON.stringify(state));
  }
  function drillPracticed(kind) { return drillState()[kind] || {}; }
  function preferNew() { return drillState().preferNew !== false; }
  function setPreferNew(on) {
    const state = drillState();
    state.preferNew = on;
    saveDrillState(state);
  }
  function markPracticed(kind, id) {
    const state = drillState();
    if (!state[kind]) state[kind] = {};
    state[kind][id] = Date.now();
    saveDrillState(state);
  }
  function clearDrillRecords() {
    const state = drillState();
    delete state.p1;
    delete state.p2;
    saveDrillState(state);
  }

  // 抽题：没练过的优先；勾了「优先抽新题」时再把新题排到旧题前面
  function drawOne(pool, kind) {
    const done = drillPracticed(kind);
    const freshNotDone = [], oldNotDone = [], freshDone = [], oldDone = [];
    pool.forEach(item => {
      const isNew = item.status === 'new';
      if (isNew && !done[item.id]) freshNotDone.push(item);
      else if (!isNew && !done[item.id]) oldNotDone.push(item);
      else if (isNew) freshDone.push(item);
      else oldDone.push(item);
    });
    const order = preferNew()
      ? [freshNotDone, oldNotDone, freshDone, oldDone]
      : [freshNotDone.concat(oldNotDone), freshDone.concat(oldDone)];
    const candidates = order.find(list => list.length) || [];
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  function fmtTime(totalSec) {
    const sec = Math.max(totalSec, 0);
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function drillBeep(times) {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx();
      for (let i = 0; i < times; i++) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        const t0 = ctx.currentTime + i * 0.22;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
        osc.start(t0);
        osc.stop(t0 + 0.2);
      }
    } catch (e) { /* 没有音频环境就安静结束 */ }
  }

  function startCountdown(seconds, el, onEnd) {
    const endAt = Date.now() + seconds * 1000;
    const timer = setInterval(() => {
      const left = Math.round((endAt - Date.now()) / 1000);
      el.textContent = fmtTime(left);
      if (left <= 10) el.classList.add('warn');
      if (left <= 0) {
        clearInterval(timer);
        drillBeep(3);
        if (onEnd) onEnd();
      }
    }, 250);
    drillTimers.push(timer);
  }

  function elapsedTick(el) {
    const t0 = Date.now();
    const timer = setInterval(() => {
      el.textContent = '已用 ' + fmtTime(Math.round((Date.now() - t0) / 1000));
    }, 500);
    drillTimers.push(timer);
  }

  function statusBadge(status) {
    const label = { new: '新题', retained: '保留题', classic: '万年老题' }[status] || '保留题';
    return ' <span class="badge ' + esc(status) + '">' + label + '</span>';
  }

  function scriptHintLine(card) {
    if (!card.script) return '';
    const names = {
      '剧本一': '剧本一（港深黑客松）',
      '剧本二': '剧本二（朋友送的篮球）',
      '剧本三': '剧本三（机器人队长）'
    };
    return '<p class="note">建议套' + esc(names[card.script] || card.script) + '，剧情见「P2资料 · 剧本卡片」。</p>';
  }

  function drillToolbarHTML() {
    return '<div class="drill-toolbar">' +
      '<label class="drill-check"><input type="checkbox" id="preferNewChk"' + (preferNew() ? ' checked' : '') + '>优先抽新题</label>' +
      '<span class="drill-stat" id="drillStat"></span>' +
      '<button class="link-btn" id="clearDrillBtn" type="button">清除练习记录</button>' +
      '</div>';
  }

  // 工具条统一绑定：优先新题开关 + 清除练习记录（两步确认防误触，只清已练记录，保留开关偏好）
  function bindDrillToolbar(root, updateStat) {
    root.querySelector('#preferNewChk').addEventListener('change', ev => setPreferNew(ev.target.checked));
    const btn = root.querySelector('#clearDrillBtn');
    let armed = false;
    let resetTimer = null;
    btn.addEventListener('click', () => {
      if (!armed) {
        armed = true;
        btn.textContent = '再点一次确认清除';
        resetTimer = setTimeout(() => {
          armed = false;
          btn.textContent = '清除练习记录';
        }, 3000);
        return;
      }
      clearTimeout(resetTimer);
      armed = false;
      clearDrillRecords();
      btn.textContent = '已清除 ✓';
      updateStat();
      setTimeout(() => { btn.textContent = '清除练习记录'; }, 1500);
    });
  }

  function poolStat(pool, kind) {
    const done = drillPracticed(kind);
    const fresh = pool.filter(item => item.status === 'new').length;
    const doneCount = pool.filter(item => done[item.id]).length;
    return '题库 ' + esc(QB.version) + ' · 本池 ' + pool.length + ' 题 · 新题 ' + fresh + ' · 已过 ' + doneCount;
  }

  function cueCardHTML(card, withBadge) {
    return '<div class="cue-card"><h3>' + esc(card.title) + (withBadge ? statusBadge(card.status) : '') + '</h3>' +
      '<p class="speech">' + esc(card.cue) + '</p>' +
      '<ul>' + card.points.map(point => '<li class="qitem" style="cursor:default">' + esc(point) + '</li>').join('') + '</ul>' +
      scriptHintLine(card) +
      '</div>';
  }

  function p3ListHTML(questions) {
    if (!questions.length) return '<p class="note">这张题卡在题库里没有 P3 追问。</p>';
    return '<div class="cue-card"><h3>P3 追问</h3>' +
      '<p class="qidx" id="p3Idx"></p>' +
      '<ul>' + questions.map(q => '<li class="qitem">' + esc(q) + '</li>').join('') + '</ul>' +
      '</div>';
  }

  // P3 逐题过：点题切到那题，「下一问」往后走
  function bindP3Walk(container, questions) {
    if (!questions.length) return null;
    const items = container.querySelectorAll('.cue-card .qitem');
    const idxEl = container.querySelector('#p3Idx');
    let cur = 0;
    function setCur(i) {
      cur = i;
      items.forEach(x => x.classList.remove('current'));
      items[i].classList.add('current');
      idxEl.textContent = '第 ' + (i + 1) + ' / ' + questions.length + ' 题 · 点题可跳，答完点「下一问」';
    }
    items.forEach((li, i) => li.addEventListener('click', () => setCur(i)));
    const nextBtn = container.querySelector('#p3Next');
    if (nextBtn) nextBtn.addEventListener('click', () => { if (cur < questions.length - 1) setCur(cur + 1); });
    setCur(0);
    return { setCur };
  }

  // ---- P1 抽题 ----
  function renderDrillP1(root) {
    const pool = QB.p1;
    root.innerHTML =
      '<p class="detail-intro">抽一个话题，把小问逐题说一遍：点小问切当前题，每题按人设答 2–4 句，不要第一轮说满。</p>' +
      drillToolbarHTML() +
      '<div id="drillBody"></div>';
    const stat = root.querySelector('#drillStat');
    const body = root.querySelector('#drillBody');
    function updateStat() { stat.textContent = poolStat(pool, 'p1'); }
    bindDrillToolbar(root, updateStat);
    function draw() {
      clearDrillTimers();
      const topic = drawOne(pool, 'p1');
      markPracticed('p1', topic.id);
      updateStat();
      body.innerHTML =
        '<div class="cue-card"><h3>' + esc(topic.title) + statusBadge(topic.status) + '</h3>' +
        '<ul>' + topic.questions.map(q => '<li class="qitem">' + esc(q) + '</li>').join('') + '</ul></div>' +
        '<p class="qidx" id="qIdx">点上面任意小问开始</p>' +
        '<div class="drill-actions"><button class="btn" id="redrawBtn">换一个话题</button></div>';
      const items = body.querySelectorAll('.qitem');
      const idxEl = body.querySelector('#qIdx');
      items.forEach((li, i) => li.addEventListener('click', () => {
        items.forEach(x => x.classList.remove('current'));
        li.classList.add('current');
        idxEl.textContent = '第 ' + (i + 1) + ' / ' + topic.questions.length + ' 题';
      }));
      body.querySelector('#redrawBtn').addEventListener('click', draw);
    }
    updateStat();
    draw();
  }

  // ---- P2 计时 ----
  function renderDrillP2(root) {
    const pool = QB.p2;
    root.innerHTML =
      '<p class="detail-intro">P2 和 P3 一起练：看题卡 → 准备 1 分钟（可跳过）→ 作答 2 分钟 → 接着过本题的 P3 抽象追问。P3 答案长一些：观点 + because 理由 + 一个短例子。</p>' +
      drillToolbarHTML() +
      '<div id="drillBody"></div>';
    const stat = root.querySelector('#drillStat');
    const body = root.querySelector('#drillBody');
    function updateStat() { stat.textContent = poolStat(pool, 'p2'); }
    bindDrillToolbar(root, updateStat);
    function draw() {
      clearDrillTimers();
      const card = drawOne(pool, 'p2');
      markPracticed('p2', card.id);
      updateStat();
      phaseCard(card);
    }
    function phaseCard(card) {
      clearDrillTimers();
      body.innerHTML = cueCardHTML(card, true) +
        '<div class="drill-actions">' +
        '<button class="btn" id="prepBtn">开始准备 1:00</button>' +
        '<button class="btn secondary" id="skipBtn">换一题</button></div>';
      body.querySelector('#prepBtn').addEventListener('click', () => phasePrep(card));
      body.querySelector('#skipBtn').addEventListener('click', draw);
    }
    function phasePrep(card) {
      clearDrillTimers();
      body.innerHTML = '<p class="timer-caption">准备时间（记几个要点就行，不要写全文）</p>' +
        '<div class="countdown" id="cd">1:00</div>' +
        cueCardHTML(card, true) +
        '<div class="drill-actions"><button class="btn secondary" id="skipPrep">跳过准备，直接作答</button></div>';
      startCountdown(60, body.querySelector('#cd'), () => phaseSpeak(card));
      body.querySelector('#skipPrep').addEventListener('click', () => phaseSpeak(card));
    }
    function phaseSpeak(card) {
      clearDrillTimers();
      body.innerHTML = '<p class="timer-caption">作答时间（最后 10 秒变红，说满更接近考场）</p>' +
        '<div class="countdown" id="cd">2:00</div>' +
        cueCardHTML(card, false) +
        '<div class="drill-actions"><button class="btn secondary" id="endEarly">作答完毕，提前结束</button></div>';
      startCountdown(120, body.querySelector('#cd'), () => phaseDone(card));
      body.querySelector('#endEarly').addEventListener('click', () => phaseDone(card));
    }
    function phaseDone(card) {
      clearDrillTimers();
      body.innerHTML =
        '<p class="detail-intro">本题完成。可以听听自己的录音回放，或接着把 P3 追问逐题过一遍。</p>' +
        p3ListHTML(card.p3 || []) +
        '<div class="drill-actions">' +
        (card.p3 && card.p3.length ? '<button class="btn secondary" id="p3Next">下一问</button>' : '') +
        '<button class="btn" id="againBtn">再来一题</button></div>';
      if (card.p3 && card.p3.length) bindP3Walk(body, card.p3);
      body.querySelector('#againBtn').addEventListener('click', draw);
    }
    updateStat();
    draw();
  }

  // ---- 全套模拟 ----
  function renderDrillFull(root) {
    const pool = QB.p2.filter(card => card.p3 && card.p3.length);
    root.innerHTML =
      '<p class="detail-intro">按真实考试走完整流程：P1 两个话题 → P2 准备 1 分钟 + 作答 2 分钟 → 同题 P3。整轮 11–14 分钟。</p>' +
      drillToolbarHTML() +
      '<div id="drillBody"><div class="drill-actions"><button class="btn" id="startBtn">开始全套模拟</button></div></div>';
    const stat = root.querySelector('#drillStat');
    const body = root.querySelector('#drillBody');
    function updateStat() { stat.textContent = poolStat(pool, 'p2'); }
    bindDrillToolbar(root, updateStat);

    body.querySelector('#startBtn').addEventListener('click', () => {
      const topics = [];
      const used = {};
      while (topics.length < 2) {
        const topic = drawOne(QB.p1, 'p1');
        if (used[topic.id]) continue;
        used[topic.id] = true;
        topics.push(topic);
        markPracticed('p1', topic.id);
      }
      const card = drawOne(pool, 'p2');
      markPracticed('p2', card.id);
      runSession(topics, card);
    });

    function stageHTML(stage) {
      return '<div class="stage">' +
        ['Part 1', 'Part 2', 'Part 3'].map(name =>
          '<span class="' + (name === stage ? 'on' : '') + '">' + name + '</span>').join('') +
        '<span class="drill-total" id="totalEl"></span></div>';
    }

    function runSession(topics, card) {
      const t0 = Date.now();
      function phase1() {
        clearDrillTimers();
        body.innerHTML = stageHTML('Part 1') +
          topics.map(topic =>
            '<div class="cue-card"><h3>' + esc(topic.title) + statusBadge(topic.status) + '</h3>' +
            '<ul>' + topic.questions.map(q => '<li class="qitem">' + esc(q) + '</li>').join('') + '</ul></div>'
          ).join('') +
          '<p class="qidx" id="walkIdx"></p>' +
          '<div class="drill-actions"><button class="btn" id="toP2">进入 Part 2</button></div>';
        const items = body.querySelectorAll('.qitem');
        const idxEl = body.querySelector('#walkIdx');
        items.forEach((li, i) => li.addEventListener('click', () => {
          items.forEach(x => x.classList.remove('current'));
          li.classList.add('current');
          idxEl.textContent = 'P1 第 ' + (i + 1) + ' / ' + items.length + ' 问';
        }));
        items[0].classList.add('current');
        idxEl.textContent = 'P1 第 1 / ' + items.length + ' 问';
        elapsedTick(body.querySelector('#totalEl'));
        body.querySelector('#toP2').addEventListener('click', phase2);
      }
      function phase2() {
        clearDrillTimers();
        body.innerHTML = stageHTML('Part 2') +
          '<p class="timer-caption">准备时间（记几个要点就行）</p>' +
          '<div class="countdown" id="cd">1:00</div>' +
          cueCardHTML(card, true) +
          '<div class="drill-actions"><button class="btn secondary" id="skipPrep">跳过准备</button></div>';
        startCountdown(60, body.querySelector('#cd'), phase2speak);
        body.querySelector('#skipPrep').addEventListener('click', phase2speak);
      }
      function phase2speak() {
        clearDrillTimers();
        body.innerHTML = stageHTML('Part 2') +
          '<p class="timer-caption">作答时间（最后 10 秒变红）</p>' +
          '<div class="countdown" id="cd">2:00</div>' +
          cueCardHTML(card, false) +
          '<div class="drill-actions"><button class="btn secondary" id="endEarly">提前结束</button></div>';
        startCountdown(120, body.querySelector('#cd'), phase3);
        body.querySelector('#endEarly').addEventListener('click', phase3);
      }
      function phase3() {
        clearDrillTimers();
        body.innerHTML = stageHTML('Part 3') +
          '<p class="qidx">顺着刚才的题卡追问：</p>' +
          p3ListHTML(card.p3) +
          '<div class="drill-actions">' +
          '<button class="btn secondary" id="p3Next">下一问</button>' +
          '<button class="btn" id="finishBtn">结束模拟</button></div>';
        bindP3Walk(body, card.p3);
        body.querySelector('#finishBtn').addEventListener('click', done);
      }
      function done() {
        clearDrillTimers();
        const total = fmtTime(Math.round((Date.now() - t0) / 1000));
        body.innerHTML =
          '<p class="detail-intro">全套完成，总用时 ' + esc(total) + '（真实考试 11–14 分钟）。回头看看抽到的题该套哪个剧本？</p>' +
          '<div class="drill-actions"><button class="btn" id="againBtn">再来一轮</button></div>';
        body.querySelector('#againBtn').addEventListener('click', () => renderDrillFull(root));
      }
      phase1();
    }
  }

  // ---- 演练页入口 ----
  function renderDrillPage(section, card) {
    titleEl.textContent = card.title;
    subtitleEl.textContent = section.name;
    renderNav(section, card, null);
    if (!QB || !QB.p1 || !QB.p2) {
      app.innerHTML = '<div class="detail"><p class="placeholder">题库数据没加载到：确认 speaking-questions.js 存在（本地跑 更新口语题库.py 生成）。</p></div>';
      return;
    }
    const root = document.createElement('div');
    root.className = 'detail';
    if (card.drill === 'p1') renderDrillP1(root);
    else if (card.drill === 'p2') renderDrillP2(root);
    else if (card.drill === 'full') renderDrillFull(root);
    else root.innerHTML = '<p class="placeholder">未知演练类型。</p>';
    app.innerHTML = '';
    app.appendChild(root);
  }

  // 按 hash 决定显示首页、部分、卡片或子卡片
  function render() {
    clearDrillTimers();
    const { sectionId, cardId, nestedId } = parseHash();
    const section = findSection(sectionId);
    if (!section) {
      renderHome();
      return;
    }
    const card = cardId ? findCard(section, cardId) : null;
    if (cardId && !card) {
      renderSection(section);
      return;
    }
    if (!card) {
      renderSection(section);
      return;
    }
    if (card.type === 'group') {
      if (nestedId) {
        const nested = findNestedCard(card, nestedId);
        if (!nested) {
          renderGroup(section, card);
          return;
        }
        renderCard(section, nested, card);
        return;
      }
      renderGroup(section, card);
      return;
    }
    renderCard(section, card);
  }

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
